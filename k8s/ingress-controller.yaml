apiVersion: v1
kind: ServiceAccount
metadata: {name: traefik, namespace: heart-mlops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: heart-traefik}
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: heart-traefik}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: heart-traefik}
subjects: [{kind: ServiceAccount, name: traefik, namespace: heart-mlops}]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: traefik}
spec: {controller: traefik.io/ingress-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traefik, namespace: heart-mlops}
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3.6
          args:
            - --entrypoints.web.address=:8000
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=heart-mlops
            - --providers.kubernetesingress.ingressclass=traefik
          ports: [{name: web, containerPort: 8000}]
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata: {name: traefik, namespace: heart-mlops}
spec:
  type: NodePort
  selector: {app: traefik}
  ports: [{port: 80, targetPort: web, nodePort: 30080}]
